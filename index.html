<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>탭스터디 (TabStudy)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #0f172a;
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        /* 메인 학습 컨테이너 (커버플로우 영역) */
        .app-container {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
            overflow: hidden;
            padding: 20px;
        }
        /* 낱말 카드 스타일 */
        .card-stack {
            width: 100%;
            max-width: 360px;
            height: 75vh;
            max-height: 520px;
            position: absolute;
            cursor: pointer;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
        }
        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border-radius: 24px;
        }
        .card-stack.flipped .card-inner {
            transform: rotateY(180deg);
        }
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 30px 20px;
            background: #ffffff;
        }
        .card-back {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: #ffffff;
            transform: rotateY(180deg);
            justify-content: center;
            align-items: center;
        }
        /* 카드 내부 콘텐츠 */
        .card-img-box {
            width: 100%;
            height: 50%;
            border-radius: 16px;
            overflow: hidden;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .word-info {
            text-align: center;
            margin-bottom: 20px;
        }
        .kanji-text {
            font-size: 3rem;
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 5px;
        }
        .kana-text {
            font-size: 1.2rem;
            color: #64748b;
            margin-bottom: 10px;
        }
        .meaning-text {
            font-size: 1.5rem;
            font-weight: bold;
            color: #2563eb;
        }
        .back-pronun {
            font-size: 3rem;
            font-weight: bold;
            letter-spacing: 2px;
        }
        /* 하단 애드몹 배너 광고 영역 */
        .admob-banner {
            width: 100%;
            height: 55px;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            border-top: 1px solid #e2e8f0;
            font-size: 0.8rem;
            color: #94a3b8;
        }
        /* 조작 가이드 안내 */
        .guide-text {
            position: absolute;
            top: 15px;
            color: #94a3b8;
            font-size: 0.85rem;
            text-align: center;
            width: 100%;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="guide-text">좌우로 스와이프하여 넘기고, 터치하면 뒤집힙니다</div>

    <!-- 커버플로우 학습 영역 -->
    <div class="app-container" id="cardContainer">
        <!-- 동적으로 카드가 생성됩니다 -->
    </div>

    <!-- 하단 구글 애드몹 배너 광고 고정 영역 -->
    <div class="admob-banner">
        <span>Google AdMob Banner Ad Area (50px)</span>
    </div>

    <script>
        // 구글 스프레드시트 연동 데이터 (실시간 로드 또는 기본 내장 데이터)
        const wordData = [
            { word: "犬", kana: "いぬ", meaning: "개, 강아지", pron: "이누", img: "https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=500" },
            { word: "猫", kana: "ねこ", meaning: "고양이", pron: "네코", img: "https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=500" },
            { word: "鮪", kana: "まぐろ", meaning: "참치", pron: "마구로", img: "https://images.unsplash.com/photo-1534422298391-e4f8c172dddb?w=500" }
        ];

        let currentIndex = 0;
        const container = document.getElementById('cardContainer');

        function renderCards() {
            container.innerHTML = '';
            
            // 커버플로우 효과를 위해 현재 카드 기준 앞뒤로 렌더링
            wordData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card-stack';
                
                let offset = index - currentIndex;
                if (offset < 0) offset += wordData.length; // 순환 구조

                // 스와이프/커버플로우 위치 계산 스타일 적용
                if (offset === 0) {
                    card.style.transform = 'translateX(0) scale(1) rotate(0deg)';
                    card.style.zIndex = 10;
                    card.style.opacity = 1;
                } else if (offset === 1) {
                    card.style.transform = 'translateX(30px) scale(0.95) rotate(5deg)';
                    card.style.zIndex = 9;
                    card.style.opacity = 0.7;
                } else {
                    card.style.transform = 'translateX(60px) scale(0.9) rotate(10deg)';
                    card.style.zIndex = 8;
                    card.style.opacity = 0.4;
                }

                card.innerHTML = `
                    <div class="card-inner">
                        <div class="card-face card-front">
                            <div class="card-img-box">
                                <img src="${item.img}" alt="illustration">
                            </div>
                            <div class="word-info">
                                <div class="kanji-text">${item.word}</div>
                                <div class="kana-text">${item.kana}</div>
                                <div class="meaning-text">${item.meaning}</div>
                            </div>
                        </div>
                        <div class="card-face card-back">
                            <div class="back-pronun">${item.pron}</div>
                        </div>
                    </div>
                `;

                // 카드 클릭 시 3D 플립 이벤트
                card.addEventListener('click', (e) => {
                    if (offset === 0) {
                        card.classList.toggle('flipped');
                    } else {
                        currentIndex = index;
                        renderCards();
                    }
                });

                container.appendChild(card);
            });
        }

        // 터치 스와이프 기능 구현
        let touchStartX = 0;
        container.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        });

        container.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 50) {
                // 왼쪽으로 스와이프 (다음 카드)
                currentIndex = (currentIndex + 1) % wordData.length;
                renderCards();
            } else if (touchEndX - touchStartX > 50) {
                // 오른쪽으로 스와이프 (이전 카드)
                currentIndex = (currentIndex - 1 + wordData.length) % wordData.length;
                renderCards();
            }
        });

        // 초기 렌더링 실행
        renderCards();
    </script>
</body>
</html>
